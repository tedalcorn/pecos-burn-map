<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pecos Wilderness — Burn Areas &amp; Trails</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --surface: #fcfcfb; --hairline: rgba(11,11,11,0.10);
    --hl: #2a78d6; --route: #6d28d9;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  #app { display: flex; flex-direction: column; height: 100%; }
  header {
    background: var(--surface); border-bottom: 1px solid var(--hairline);
    padding: 10px 16px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; font-weight: 650; }
  header .sub { font-size: 12.5px; color: var(--ink-2); }
  header .sub a { color: inherit; }
  #map { flex: 1; }

  .panel {
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12); font: 12.5px/1.5 system-ui, sans-serif;
  }
  /* search (top-left, under zoom) */
  #search { position: relative; width: 210px; }
  #search input {
    width: 100%; padding: 6px 9px; font: 12.5px system-ui, sans-serif;
    border: 1px solid var(--hairline); border-radius: 8px; background: var(--surface);
    box-shadow: 0 1px 4px rgba(0,0,0,0.12); color: var(--ink); outline: none;
  }
  #search-results { position: absolute; top: 32px; left: 0; right: 0; max-height: 260px;
    overflow-y: auto; display: none; z-index: 1000; }
  .sres { padding: 5px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  .sres:hover { background: rgba(11,11,11,0.06); }
  .sres .mi { color: var(--muted); font-size: 11px; }

  /* route panel (right) */
  #route-panel { width: 235px; max-height: 60vh; overflow-y: auto; padding: 10px 12px; }
  #route-panel .t { font-weight: 650; display: flex; justify-content: space-between; align-items: baseline; }
  #route-panel .t button {
    border: none; background: none; color: var(--muted); cursor: pointer; font-size: 12px; padding: 0;
  }
  #route-panel .t button:hover { color: var(--ink); }
  #route-stats { margin: 4px 0 6px; color: var(--ink-2); }
  #route-stats b { color: var(--ink); font-weight: 650; }
  .rseg { padding: 3px 0; border-top: 1px solid var(--hairline); }
  .rseg .nm { display: flex; justify-content: space-between; gap: 8px; }
  .rseg .mi { color: var(--muted); font-size: 11px; flex: none; }
  .rseg .gap, .rseg .warn { color: var(--muted); font-size: 11px; }
  .rseg .warn { color: #9c3810; }
  #route-hint { color: var(--muted); }

  /* trail info card (left, under search) */
  #info-card {
    position: absolute; left: 10px; top: 148px; z-index: 1001; width: 262px;
    padding: 10px 12px; display: none; max-height: calc(100% - 170px); overflow-y: auto;
  }
  #info-card .t { font-weight: 650; display: flex; justify-content: space-between; align-items: baseline; }
  #info-card .t button { border: none; background: none; color: var(--muted); cursor: pointer; padding: 0; font-size: 13px; }
  #info-card .sub2 { color: var(--ink-2); margin: 2px 0 6px; }
  #info-card .ct { font-size: 11px; color: var(--muted); margin: 8px 0 2px; }
  #info-card .theme { color: var(--ink-2); }
  #info-card .warn { color: #9c3810; }

  .legend { padding: 10px 12px; font-size: 12px; color: var(--ink-2); max-width: 200px; }
  .legend .t { font-weight: 650; color: var(--ink); margin-bottom: 4px; }
  .legend .row { display: flex; align-items: center; gap: 7px; }
  .legend .sw { width: 14px; height: 14px; border-radius: 3px; flex: none; opacity: 0.75; }
  .legend .ln { width: 14px; height: 0; border-top: 2.5px dashed #d02090; flex: none; }
  .legend .wl { width: 14px; height: 0; border-top: 2px dashed #1d5c33; flex: none; }
  .leaflet-tooltip { font: 12px system-ui, sans-serif; }
  .th-icon, .cabin-icon { background: none; border: none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Pecos Wilderness — Burn Areas &amp; Trails</h1>
    <span class="sub" id="updated">Loading…</span>
    <span class="sub">Fires: NIFC/WFIGS/MTBS · Trails: USFS · <a href="https://www.fs.usda.gov/r03/santafe/alerts" target="_blank" rel="noopener">Current SFNF alerts &amp; closures ↗</a></span>
  </header>
  <div id="map"></div>
</div>
<script>
const BINS = [
  { max: 1989, label: "Before 1990", color: "#f29c6b" },
  { max: 1999, label: "1990s",       color: "#ea7440" },
  { max: 2009, label: "2000s",       color: "#d1511d" },
  { max: 2019, label: "2010s",       color: "#9c3810" },
  { max: 9999, label: "2020s",       color: "#66230a" },
];
const binOf = y => BINS.find(b => (y ?? 0) <= b.max);

// The cabin (6 Mudge Rd, Cowles) — nudge these coords if the icon sits wrong.
const CABIN = [35.8179, -105.6573];

// Hand-maintained closure notes shown in trailhead tooltips; prune when they expire.
const TH_NOTES = {
  "Panchuela Trailhead": "⚠ campground closed for construction thru 9/30/2026",
  "Jacks Creek Trailhead": "⚠ campground + FR 555 closed for construction thru 9/30/2026",
};

const CONNECT_M = 150;   // ≤ this: segments count as touching
const GAP_M = 1000;      // ≤ this: extend the route across a (shown) data gap

const map = L.map("map", { zoomSnap: 0.5 }).setView([35.87, -105.65], 11);
const usgsBase = L.tileLayer("https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 16,
  attribution: "USGS The National Map · Fires: NIFC, MTBS · Trails: USFS EDW · Elevation: AWS Terrain",
}).addTo(map);
const esriBase = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 16,
  attribution: "Esri World Topo · Fires: NIFC, MTBS · Trails: USFS EDW · Elevation: AWS Terrain",
});

const fmt = n => n == null ? "—" : n.toLocaleString();
const titleCase = s => (s || "").replace(/\w\S*/g, t => t[0] + t.slice(1).toLowerCase());
const distM = (a, b) => {   // [lng,lat] equirectangular meters
  const dx = (a[0] - b[0]) * 111320 * Math.cos((a[1] + b[1]) / 2 * Math.PI / 180);
  const dy = (a[1] - b[1]) * 110540;
  return Math.hypot(dx, dy);
};

const flagIcon = L.divIcon({
  className: "th-icon", iconSize: [20, 22], iconAnchor: [3, 21],
  html: `<svg width="20" height="22" viewBox="0 0 20 22">
    <line x1="3" y1="1.5" x2="3" y2="21" stroke="#1c3f8f" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M4 2 L16 5.5 L4 9 Z" fill="#2a58c6" stroke="#1c3f8f" stroke-width="0.8"/></svg>`,
});
const cabinIcon = L.divIcon({
  className: "cabin-icon", iconSize: [26, 24], iconAnchor: [13, 22],
  html: `<svg width="26" height="24" viewBox="0 0 26 24">
    <path d="M3 11 L13 3 L23 11" fill="none" stroke="#7a5c00" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="6" y="11" width="14" height="10" fill="#e3b505" stroke="#7a5c00" stroke-width="1.4"/>
    <rect x="11" y="14" width="4" height="7" fill="#7a5c00"/></svg>`,
});

Promise.all([
  ...["fires", "trails", "wilderness", "trailheads", "meta"].map(n =>
    fetch("data/" + n + (n === "meta" ? ".json" : ".geojson")).then(r => r.json())),
  fetch("data/conditions.json").then(r => r.ok ? r.json() : null).catch(() => null),
]).then(([fires, trails, wilderness, trailheads, meta, conditions]) => {
  const cond = (conditions && conditions.usfs) || {};
  const FLAG_LABELS = {
    deadfall: "deadfall/blowdown", washout: "washouts", overgrown: "overgrown",
    hard_to_follow: "hard to follow", snow_ice: "snow/ice", mud: "mud",
    bugs: "bugs", burn: "burn-area mentions", rating_drop: "rating declining",
  };
  const flagsOf = no => ((cond[no] || {}).flags || []).map(f => FLAG_LABELS[f] || f);

  const fireLayer = L.geoJSON(fires, {
    style: f => ({
      color: binOf(f.properties.year).color, weight: 1,
      fillColor: binOf(f.properties.year).color, fillOpacity: 0.42,
    }),
    onEachFeature: (f, l) => {
      const p = f.properties;
      l.bindPopup(`<b>${p.name} Fire</b><br>
        <span style="color:var(--ink-2)">${p.year ?? "Year unknown"} · ${fmt(p.acres)} acres</span>`);
    },
  }).addTo(map);

  const wildLayer = L.geoJSON(wilderness, {
    style: { color: "#1d5c33", weight: 1.25, opacity: 0.5, dashArray: "6 4", fill: false },
    interactive: false,
  });   // off by default — toggle in the layer control

  // ---------- trails: hover tooltip, click = route builder ----------
  const baseStyle = { color: "#d02090", weight: 2.25, opacity: 1, dashArray: "5 4" };
  const searchStyle = { color: "#2a78d6", weight: 4.5, opacity: 1 };
  const routeStyle = { color: "#6d28d9", weight: 5, opacity: 1 };
  const candStyle = { color: "#6d28d9", weight: 3.5, opacity: 0.35 };  // attachable next segments

  const segs = [];           // per feature: {layer, props, parts, ends, miles}
  const byTrail = {};        // normalized name|no -> seg indexes
  let searchSel = null;      // key highlighted via search
  let chain = [];            // route: [{i, rev, gapM}]
  const candidates = new Set();

  const flat = g => g.type === "LineString" ? [g.coordinates] : g.coordinates;

  const trailRenderer = L.canvas({ tolerance: 8 });   // fat click target for thin lines
  const trailLayer = L.geoJSON(trails, {
    renderer: trailRenderer,
    style: baseStyle,
    onEachFeature: (f, l) => {
      const p = f.properties;
      const parts = flat(f.geometry);
      const i = segs.length;
      const fl = flagsOf(p.trail_no);
      segs.push({
        layer: l, props: p, parts,
        ends: [parts[0][0], parts[parts.length - 1][parts[parts.length - 1].length - 1]],
        miles: p.gis_miles || 0, i,
      });
      const key = (p.trail_name || "Unnamed").replace(/\s+/g, "") + "|" + (p.trail_no || "");
      (byTrail[key] = byTrail[key] || []).push(i);
      l.bindTooltip(`<b>${titleCase(p.trail_name) || "Unnamed"}</b> ${p.trail_no ?? ""}` +
        ` · ${(p.gis_miles || 0).toFixed(1)} mi` +
        (fl.length ? `<br>⚠ ${fl.join(", ")}` : ""), { sticky: true });
      l.on("mouseover", () => { if (!inChain(i) && key !== searchSel) l.setStyle({ weight: 4.5 }); });
      l.on("mouseout", () => restyle(i));
      l.on("click", () => clickSeg(i));
      l.on("contextmenu", e => {
        e.originalEvent.preventDefault();
        showInfo(p.trail_no);
      });
    },
  }).addTo(map);

  const inChain = i => chain.some(c => c.i === i);
  function restyle(i) {
    const s = segs[i];
    const key = (s.props.trail_name || "Unnamed").replace(/\s+/g, "") + "|" + (s.props.trail_no || "");
    if (inChain(i)) s.layer.setStyle(routeStyle);
    else if (candidates.has(i)) s.layer.setStyle(candStyle);
    else if (key === searchSel) s.layer.setStyle(searchStyle);
    else s.layer.setStyle(baseStyle);
  }
  function computeCandidates() {
    candidates.clear();
    if (!chain.length) return;
    const { head, tail } = chainEnds();
    segs.forEach(s => {
      if (inChain(s.i)) return;
      const d = Math.min(distM(s.ends[0], head), distM(s.ends[1], head),
                         distM(s.ends[0], tail), distM(s.ends[1], tail));
      if (d <= GAP_M) candidates.add(s.i);
    });
  }
  const restyleAll = () => { computeCandidates(); segs.forEach(s => restyle(s.i)); };

  // ---------- route builder ----------
  function chainEnds() {
    if (!chain.length) return null;
    const first = chain[0], last = chain[chain.length - 1];
    const head = first.rev ? segs[first.i].ends[1] : segs[first.i].ends[0];
    const tail = last.rev ? segs[last.i].ends[0] : segs[last.i].ends[1];
    return { head, tail };
  }

  function clickSeg(i) {
    const pos = chain.findIndex(c => c.i === i);
    if (pos >= 0) {
      chain = pos === 0 && chain.length > 1 ? chain.slice(1) : chain.slice(0, pos);
    } else if (!chain.length) {
      chain = [{ i, rev: false, gapM: 0 }];
    } else {
      const { head, tail } = chainEnds();
      const s = segs[i];
      const cands = [   // [dist, attach-at-tail?, reversed?]
        [distM(s.ends[0], tail), true, false],
        [distM(s.ends[1], tail), true, true],
        [distM(s.ends[0], head), false, true],
        [distM(s.ends[1], head), false, false],
      ].sort((a, b) => a[0] - b[0]);
      const [d, atTail, rev] = cands[0];
      if (d <= GAP_M) {
        const gap = d > CONNECT_M ? d : 0;
        if (atTail) chain.push({ i, rev, gapM: gap });
        else {
          // gapM marks the gap BEFORE a row; on head-attach it belongs to the old head
          chain[0].gapM = gap;
          chain.unshift({ i, rev, gapM: 0 });
        }
      } else {
        chain = [{ i, rev: false, gapM: 0 }];
      }
    }
    restyleAll();
    renderRoute();
  }

  function segGainLoss(s, rev) {
    let g = 0, l = 0;
    for (const part of s.parts) {
      const els = part.map(c => c[2] ?? 0);
      const sm = els.map((e, j) =>
        j > 0 && j < els.length - 1 ? (els[j - 1] + els[j] + els[j + 1]) / 3 : e);
      for (let j = 1; j < sm.length; j++) {
        const d = sm[j] - sm[j - 1];
        if (d > 0) g += d; else l -= d;
      }
    }
    return rev ? [l, g] : [g, l];
  }

  function renderRoute() {
    const list = document.getElementById("route-segs");
    const stats = document.getElementById("route-stats");
    const hint = document.getElementById("route-hint");
    list.innerHTML = "";
    if (!chain.length) {
      stats.textContent = "";
      hint.style.display = "";
      return;
    }
    hint.style.display = "none";
    let miles = 0, gain = 0, loss = 0;
    chain.forEach(c => {
      const s = segs[c.i];
      miles += s.miles + c.gapM / 1609.34;
      const [g, l] = segGainLoss(s, c.rev);
      gain += g; loss += l;
      const fl = flagsOf(s.props.trail_no);
      const d = document.createElement("div");
      d.className = "rseg";
      d.style.cursor = "pointer";
      d.title = "AllTrails review history";
      d.innerHTML =
        (c.gapM ? `<div class="gap">· · · ${(c.gapM / 1609.34).toFixed(1)} mi gap in trail data · · ·</div>` : "") +
        `<div class="nm"><span>${titleCase(s.props.trail_name) || "Unnamed"} <span style="color:var(--muted)">${s.props.trail_no ?? ""}</span></span>
         <span class="mi">${s.miles.toFixed(1)} mi</span></div>` +
        (fl.length ? `<div class="warn">⚠ ${fl.join(", ")}</div>` : "");
      d.onclick = () => showInfo(s.props.trail_no);
      list.appendChild(d);
    });
    stats.innerHTML = `<b>${miles.toFixed(1)} mi</b> one way · ` +
      `<b>+${Math.round(gain * 3.28084).toLocaleString()} ft</b> / −${Math.round(loss * 3.28084).toLocaleString()} ft`;
  }

  const routeCtl = L.control({ position: "topright" });
  routeCtl.onAdd = () => {
    const d = L.DomUtil.create("div", "panel");
    d.id = "route-panel";
    d.innerHTML = `<div class="t">Route <button id="route-clear" title="Clear route">clear ×</button></div>
      <div id="route-stats"></div>
      <div id="route-hint">Click a trail segment to start a route; connectable segments glow faint purple — click to extend. Click a selected segment to trim back. Right-click any trail for its AllTrails review history.</div>
      <div id="route-segs"></div>`;
    L.DomEvent.disableClickPropagation(d);
    d.querySelector("#route-clear").onclick = () => { chain = []; restyleAll(); renderRoute(); };
    return d;
  };
  routeCtl.addTo(map);

  // ---------- trail info card (AllTrails signals) ----------
  const card = document.createElement("div");
  card.id = "info-card";
  card.className = "panel";
  map.getContainer().appendChild(card);
  L.DomEvent.disableClickPropagation(card);
  L.DomEvent.disableScrollPropagation(card);

  const TAG_LABELS = {
    deadfall: "deadfall", washout: "washouts", overgrown: "overgrown",
    hard_to_follow: "hard to follow", snow_ice: "snow/ice", mud: "mud",
    bugs: "bugs", burn: "burn area", maintained: "✓ maintenance",
  };
  const wildAvg = conditions && conditions.wilderness_avg_rating;

  function barChart(annual) {
    const years = [];
    for (let y = 2010; y <= new Date().getFullYear(); y++) years.push(String(y));
    const max = Math.max(1, ...years.map(y => { const a = annual[y] || [0]; return a[2] || a[0]; }));
    const W = 238, H = 46, bw = W / years.length;
    const bars = years.map((y, i) => {
      const a = annual[y] || [0];
      const n = a[0], est = a[2];
      const h = n / max * (H - 12);
      let r = "";
      if (est && est > n) {   // current year: outline = estimated full-year total
        const he = est / max * (H - 12);
        r += `<rect x="${(i * bw + 1).toFixed(1)}" y="${(H - he).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${he.toFixed(1)}" rx="1.5" fill="none" stroke="#2a78d6" stroke-width="1" stroke-dasharray="2 2"/>`;
      }
      r += `<rect x="${(i * bw + 1).toFixed(1)}" y="${(H - h).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="#2a78d6"/>`;
      return r;
    }).join("");
    return `<svg width="${W}" height="${H + 12}" role="img">${bars}
      <text x="0" y="${H + 10}" font-size="9" fill="#898781">2010</text>
      <text x="${W}" y="${H + 10}" font-size="9" fill="#898781" text-anchor="end">${years[years.length - 1]}</text>
      <text x="${W}" y="8" font-size="9" fill="#898781" text-anchor="end">max ${max}/yr</text></svg>`;
  }

  function ratingChart(annual) {
    const years = [];
    for (let y = 2010; y <= new Date().getFullYear(); y++) years.push(String(y));
    const W = 238, H = 44, bw = W / years.length;
    const yOf = r => 4 + (5 - r) / 2 * (H - 8);   // 5★ top, 3★ bottom
    let marks = "";
    years.forEach((y, i) => {
      const [n, r] = annual[y] || [0, null];
      if (r == null || r < 3) return;
      const solid = n >= 10;   // hollow = too few reviews to trust
      marks += `<circle cx="${(i * bw + bw / 2).toFixed(1)}" cy="${yOf(r).toFixed(1)}" r="2.6"
        fill="${solid ? "#2a78d6" : "none"}" stroke="#2a78d6" stroke-width="1.3"/>`;
    });
    const avgLine = wildAvg ? `<line x1="0" x2="${W}" y1="${yOf(wildAvg).toFixed(1)}" y2="${yOf(wildAvg).toFixed(1)}"
      stroke="#c3c2b7" stroke-dasharray="3 3"/>` : "";
    return `<svg width="${W}" height="${H}" role="img">${avgLine}${marks}
      <text x="0" y="9" font-size="9" fill="#898781">5★</text>
      <text x="0" y="${H - 2}" font-size="9" fill="#898781">3★</text></svg>`;
  }

  function showInfo(no) {
    const c = cond[no];
    const meta = Object.values(info).find(v => v.no === no);
    const nm = meta ? meta.name : (c ? c.name : "Trail " + no);
    let body;
    if (!c || !c.reviews_total) {
      body = `<div class="sub2">No AllTrails coverage for this trail.</div>`;
    } else {
      const flags = (c.flags || []).map(f => FLAG_LABELS[f] || f).join(", ");
      const r6 = c.recent6 || {};
      const themes = Object.entries(r6.tags || {}).slice(0, 5)
        .map(([t, n]) => `${TAG_LABELS[t] || t} ${n}`).join(" · ");
      body = `
        <div class="sub2">${c.n_routes} AllTrails route${c.n_routes > 1 ? "s" : ""} · ${c.reviews_total.toLocaleString()} reviews</div>
        ${flags ? `<div class="warn">⚠ ${flags}</div>` : ""}
        <div class="ct">Reviews per year (dotted = full-year estimate from YTD pace)</div>${barChart(c.annual || {})}
        <div class="ct">Avg rating by year (hollow = under 10 reviews; dashes = wilderness avg ${wildAvg}★)</div>${ratingChart(c.annual || {})}
        <div class="ct">Last 6 months — ${r6.n || 0} reviews${r6.rating ? ` · ${r6.rating}★` : ""}</div>
        <div class="theme">${themes || "no condition mentions"}</div>`;
    }
    card.innerHTML = `<div class="t"><span>${nm} <span style="color:var(--muted)">${no ?? ""}</span></span>
      <button id="info-close">×</button></div>${body}`;
    card.style.display = "block";
    card.querySelector("#info-close").onclick = () => card.style.display = "none";
  }

  // ---------- search ----------
  const info = {};
  segs.forEach(s => {
    const p = s.props;
    const key = (p.trail_name || "Unnamed").replace(/\s+/g, "") + "|" + (p.trail_no || "");
    info[key] = info[key] || { name: titleCase(p.trail_name) || "Unnamed", no: p.trail_no, miles: 0 };
    const nm = titleCase(p.trail_name) || "Unnamed";
    if (nm.length < info[key].name.length) info[key].name = nm;
    info[key].miles += p.gis_miles || 0;
  });

  const searchCtl = L.control({ position: "topleft" });
  searchCtl.onAdd = () => {
    const d = L.DomUtil.create("div");
    d.id = "search";
    d.innerHTML = `<input id="search-input" type="search" placeholder="Find a trail…" autocomplete="off">
      <div id="search-results" class="panel"></div>`;
    L.DomEvent.disableClickPropagation(d);
    return d;
  };
  searchCtl.addTo(map);

  function selectTrail(key) {
    searchSel = key === searchSel ? null : key;
    restyleAll();
    if (searchSel) {
      const layers = byTrail[key].map(i => segs[i].layer);
      let b = layers[0].getBounds();
      layers.forEach(l => b = b.extend(l.getBounds()));
      map.fitBounds(b.pad(0.15));
    }
  }
  setTimeout(() => {
    const inp = document.getElementById("search-input");
    const res = document.getElementById("search-results");
    inp.addEventListener("input", () => {
      const q = inp.value.trim().toLowerCase();
      res.innerHTML = "";
      if (!q) { res.style.display = "none"; searchSel = null; restyleAll(); return; }
      const hits = Object.keys(info)
        .filter(k => info[k].name.toLowerCase().includes(q) || String(info[k].no) === q)
        .sort((a, b) => info[b].miles - info[a].miles).slice(0, 9);
      hits.forEach(k => {
        const fl = flagsOf(info[k].no);
        const d = document.createElement("div");
        d.className = "sres";
        d.innerHTML = `<span>${info[k].name}${fl.length ? " ⚠" : ""} <span style="color:var(--muted)">${info[k].no ?? ""}</span></span>
          <span class="mi">${info[k].miles.toFixed(1)} mi</span>`;
        d.title = fl.join(", ");
        d.onclick = () => { selectTrail(k); showInfo(info[k].no); res.style.display = "none"; };
        res.appendChild(d);
      });
      res.style.display = hits.length ? "block" : "none";
    });
  }, 0);

  // ---------- markers, legend, chrome ----------
  const thLayer = L.layerGroup(trailheads.features.map(f => {
    const [lng, lat] = f.geometry.coordinates;
    const name = f.properties.name;
    const note = TH_NOTES[name] ? `<br>${TH_NOTES[name]}` : "";
    return L.marker([lat, lng], { icon: flagIcon })
      .bindTooltip(`<b>${name}</b>${note}`, { direction: "top", offset: [0, -20] });
  })).addTo(map);

  L.marker(CABIN, { icon: cabinIcon, zIndexOffset: 1000 })
    .bindTooltip("<b>The cabin</b><br>6 Mudge Rd", { direction: "top", offset: [0, -22] })
    .addTo(map);

  L.control.layers({ "USGS Topo": usgsBase, "Esri Topo (cleaner)": esriBase }, {
    "Burn areas": fireLayer, "Trails": trailLayer,
    "Trailheads": thLayer, "Wilderness boundary": wildLayer,
  }, { collapsed: true, position: "bottomleft" }).addTo(map);

  const legend = L.control({ position: "bottomright" });
  legend.onAdd = () => {
    const d = L.DomUtil.create("div", "legend panel");
    d.innerHTML = `<div class="t">Burned area, by decade</div>` +
      BINS.map(b => `<div class="row"><span class="sw" style="background:${b.color}"></span>${b.label}</div>`).join("") +
      `<div class="row" style="margin-top:6px"><span class="ln"></span>USFS trail</div>`;
    return d;
  };
  legend.addTo(map);

  map.fitBounds(wildLayer.getBounds().pad(0.05));
  document.getElementById("updated").textContent =
    "Fire perimeters as of " + meta.fetched_utc.slice(0, 10) + " (auto-refreshed monthly)";
}).catch(e => {
  document.getElementById("updated").textContent = "Failed to load map data: " + e;
});
</script>
</body>
</html>
