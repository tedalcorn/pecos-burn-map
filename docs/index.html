<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pecos Wilderness — Burn Areas &amp; Trails</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --surface: #fcfcfb; --hairline: rgba(11,11,11,0.10);
    --hl: #2a78d6;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  #app { display: flex; flex-direction: column; height: 100%; }
  header {
    background: var(--surface); border-bottom: 1px solid var(--hairline);
    padding: 10px 16px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; font-weight: 650; }
  header .sub { font-size: 12.5px; color: var(--ink-2); }
  header .sub a { color: inherit; }
  #main { flex: 1; display: flex; min-height: 0; }
  #side {
    width: 230px; flex: none; background: var(--surface);
    border-right: 1px solid var(--hairline); display: flex; flex-direction: column;
  }
  #side .t { font-size: 12px; font-weight: 650; padding: 10px 12px 6px; }
  #side input {
    margin: 0 12px 8px; padding: 5px 8px; font: 12.5px system-ui, sans-serif;
    border: 1px solid var(--hairline); border-radius: 6px; background: transparent; color: var(--ink);
  }
  #trail-list { overflow-y: auto; flex: 1; padding-bottom: 8px; }
  .trow {
    padding: 4px 12px; font-size: 12.5px; cursor: pointer; display: flex;
    justify-content: space-between; gap: 8px; align-items: baseline;
  }
  .trow:hover { background: rgba(11,11,11,0.05); }
  .trow.sel { background: var(--hl); color: #fff; }
  .trow .mi { color: var(--muted); font-size: 11px; flex: none; }
  .trow.sel .mi { color: rgba(255,255,255,0.8); }
  #map { flex: 1; }
  .legend {
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px;
    padding: 10px 12px; font: 12px/1.5 system-ui, sans-serif; color: var(--ink-2);
    box-shadow: 0 1px 4px rgba(0,0,0,0.12); max-width: 200px;
  }
  .legend .t { font-weight: 650; color: var(--ink); margin-bottom: 4px; }
  .legend .row { display: flex; align-items: center; gap: 7px; }
  .legend .sw { width: 14px; height: 14px; border-radius: 3px; flex: none; opacity: 0.75; }
  .legend .ln { width: 14px; height: 0; border-top: 2.5px solid #1a1a1a; flex: none; }
  .legend .wl { width: 14px; height: 0; border-top: 2px dashed #1d5c33; flex: none; }
  .leaflet-popup-content { font: 13px/1.45 system-ui, sans-serif; }
  .leaflet-popup-content b { font-weight: 650; }
  .pop-meta { color: var(--ink-2); }
  .th-icon, .cabin-icon { background: none; border: none; }
  @media (max-width: 700px) {
    #main { flex-direction: column; }
    #side { width: 100%; height: 150px; border-right: none; border-bottom: 1px solid var(--hairline); }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Pecos Wilderness — Burn Areas &amp; Trails</h1>
    <span class="sub" id="updated">Loading…</span>
    <span class="sub">Fires: NIFC/WFIGS/MTBS · Trails: USFS · <a href="https://www.fs.usda.gov/r03/santafe/alerts" target="_blank" rel="noopener">Current SFNF alerts &amp; closures ↗</a></span>
  </header>
  <div id="main">
    <aside id="side">
      <div class="t">Trails — click to highlight</div>
      <input id="filter" type="search" placeholder="Filter by name…">
      <div id="trail-list"></div>
    </aside>
    <div id="map"></div>
  </div>
</div>
<script>
const BINS = [
  { max: 1989, label: "Before 1990", color: "#f29c6b" },
  { max: 1999, label: "1990s",       color: "#ea7440" },
  { max: 2009, label: "2000s",       color: "#d1511d" },
  { max: 2019, label: "2010s",       color: "#9c3810" },
  { max: 9999, label: "2020s",       color: "#66230a" },
];
const binOf = y => BINS.find(b => (y ?? 0) <= b.max);

// The cabin (6 Mudge Rd, Cowles) — nudge these coords if the icon sits wrong.
const CABIN = [35.8179, -105.6573];

// Hand-maintained closure notes shown in trailhead tooltips; prune when they expire.
const TH_NOTES = {
  "Panchuela Trailhead": "⚠ campground closed for construction thru 9/30/2026",
  "Jacks Creek Trailhead": "⚠ campground + FR 555 closed for construction thru 9/30/2026",
};

const map = L.map("map", { zoomSnap: 0.5 }).setView([35.87, -105.65], 11);
L.tileLayer("https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 16,
  attribution: "USGS The National Map · Fires: NIFC, MTBS · Trails: USFS EDW",
}).addTo(map);

const fmt = n => n == null ? "—" : n.toLocaleString();
const titleCase = s => (s || "").replace(/\w\S*/g, t => t[0] + t.slice(1).toLowerCase());

const flagIcon = L.divIcon({
  className: "th-icon", iconSize: [20, 22], iconAnchor: [3, 21],
  html: `<svg width="20" height="22" viewBox="0 0 20 22">
    <line x1="3" y1="1.5" x2="3" y2="21" stroke="#1c3f8f" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M4 2 L16 5.5 L4 9 Z" fill="#2a58c6" stroke="#1c3f8f" stroke-width="0.8"/></svg>`,
});
const cabinIcon = L.divIcon({
  className: "cabin-icon", iconSize: [26, 24], iconAnchor: [13, 22],
  html: `<svg width="26" height="24" viewBox="0 0 26 24">
    <path d="M3 11 L13 3 L23 11" fill="none" stroke="#7a5c00" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="6" y="11" width="14" height="10" fill="#e3b505" stroke="#7a5c00" stroke-width="1.4"/>
    <rect x="11" y="14" width="4" height="7" fill="#7a5c00"/></svg>`,
});

Promise.all(["fires", "trails", "wilderness", "trailheads", "meta"].map(n =>
  fetch("data/" + n + (n === "meta" ? ".json" : ".geojson")).then(r => r.json())
)).then(([fires, trails, wilderness, trailheads, meta]) => {

  const fireLayer = L.geoJSON(fires, {
    style: f => ({
      color: binOf(f.properties.year).color, weight: 1,
      fillColor: binOf(f.properties.year).color, fillOpacity: 0.42,
    }),
    onEachFeature: (f, l) => {
      const p = f.properties;
      l.bindPopup(`<b>${p.name} Fire</b><br>
        <span class="pop-meta">${p.year ?? "Year unknown"} · ${fmt(p.acres)} acres</span>`);
    },
  }).addTo(map);

  const wildLayer = L.geoJSON(wilderness, {
    style: { color: "#1d5c33", weight: 2, dashArray: "6 4", fill: false },
    interactive: false,
  }).addTo(map);

  const baseStyle = { color: "#1a1a1a", weight: 1.75, opacity: 0.9 };
  const hlStyle = { color: "#2a78d6", weight: 4.5, opacity: 1 };
  const byTrail = {};   // "NAME|NO" -> [layers]
  let selected = null;

  const trailLayer = L.geoJSON(trails, {
    style: baseStyle,
    onEachFeature: (f, l) => {
      const p = f.properties;
      const key = (p.trail_name || "Unnamed").replace(/\s+/g, "") + "|" + (p.trail_no || "");
      (byTrail[key] = byTrail[key] || []).push(l);
      l.bindPopup(`<b>${titleCase(p.trail_name) || "Unnamed trail"}</b><br>
        <span class="pop-meta">Trail ${p.trail_no ?? "—"}</span>`);
      l.on("mouseover", () => { if (selected !== key) l.setStyle({ weight: 4 }); });
      l.on("mouseout", () => { if (selected !== key) l.setStyle(baseStyle); });
    },
  }).addTo(map);

  const thLayer = L.layerGroup(trailheads.features.map(f => {
    const [lng, lat] = f.geometry.coordinates;
    const name = f.properties.name;
    const note = TH_NOTES[name] ? `<br>${TH_NOTES[name]}` : "";
    return L.marker([lat, lng], { icon: flagIcon })
      .bindTooltip(`<b>${name}</b>${note}`, { direction: "top", offset: [0, -20] });
  })).addTo(map);

  L.marker(CABIN, { icon: cabinIcon, zIndexOffset: 1000 })
    .bindTooltip("<b>The cabin</b><br>6 Mudge Rd", { direction: "top", offset: [0, -22] })
    .addTo(map);

  // ---- sidebar trail index ----
  const info = {};  // key -> {name, no, miles}
  trails.features.forEach(f => {
    const p = f.properties;
    const key = (p.trail_name || "Unnamed").replace(/\s+/g, "") + "|" + (p.trail_no || "");
    info[key] = info[key] || { name: titleCase(p.trail_name) || "Unnamed", no: p.trail_no, miles: 0 };
    // name variants ("Sky Line"/"Skyline") merge on key; keep the tighter spelling
    const nm = titleCase(p.trail_name) || "Unnamed";
    if (nm.length < info[key].name.length) info[key].name = nm;
    info[key].miles += p.gis_miles || 0;
  });
  const keys = Object.keys(info).sort((a, b) => info[a].name.localeCompare(info[b].name));
  const listEl = document.getElementById("trail-list");
  const rows = {};

  function select(key) {
    if (selected && byTrail[selected]) {
      byTrail[selected].forEach(l => l.setStyle(baseStyle));
      rows[selected].classList.remove("sel");
    }
    if (key === selected) { selected = null; return; }
    selected = key;
    const layers = byTrail[key] || [];
    layers.forEach(l => { l.setStyle(hlStyle); l.bringToFront(); });
    rows[key].classList.add("sel");
    if (layers.length) {
      let b = layers[0].getBounds();
      layers.forEach(l => b = b.extend(l.getBounds()));
      map.fitBounds(b.pad(0.15));
    }
  }

  keys.forEach(key => {
    const d = document.createElement("div");
    d.className = "trow";
    d.innerHTML = `<span>${info[key].name} <span style="color:var(--muted)">${info[key].no ?? ""}</span></span>
      <span class="mi">${info[key].miles.toFixed(1)} mi</span>`;
    d.onclick = () => select(key);
    rows[key] = d;
    listEl.appendChild(d);
  });

  document.getElementById("filter").addEventListener("input", e => {
    const q = e.target.value.toLowerCase();
    keys.forEach(k => rows[k].style.display = info[k].name.toLowerCase().includes(q) ? "" : "none");
  });

  L.control.layers(null, {
    "Burn areas": fireLayer, "Trails": trailLayer,
    "Trailheads": thLayer, "Wilderness boundary": wildLayer,
  }, { collapsed: true }).addTo(map);

  const legend = L.control({ position: "bottomright" });
  legend.onAdd = () => {
    const d = L.DomUtil.create("div", "legend");
    d.innerHTML = `<div class="t">Burned area, by decade</div>` +
      BINS.map(b => `<div class="row"><span class="sw" style="background:${b.color}"></span>${b.label}</div>`).join("") +
      `<div class="row" style="margin-top:6px"><span class="ln"></span>USFS trail</div>
       <div class="row"><span class="wl"></span>Wilderness boundary</div>`;
    return d;
  };
  legend.addTo(map);

  map.fitBounds(wildLayer.getBounds().pad(0.05));
  document.getElementById("updated").textContent =
    "Fire perimeters as of " + meta.fetched_utc.slice(0, 10) + " (auto-refreshed monthly)";
}).catch(e => {
  document.getElementById("updated").textContent = "Failed to load map data: " + e;
});
</script>
</body>
</html>
