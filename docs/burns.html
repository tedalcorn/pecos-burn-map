<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pecos Wilderness — Burn Table</title>
<style>
  :root {
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --surface: #fcfcfb; --hairline: rgba(11,11,11,0.10);
  }
  * { margin: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: #f9f9f7; }
  header {
    background: var(--surface); border-bottom: 1px solid var(--hairline);
    padding: 10px 16px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 16px; font-weight: 650; }
  .tabs { display: flex; gap: 2px; margin-left: 8px; }
  .tab { padding: 3px 10px; border-radius: 6px; font-size: 12.5px; color: var(--ink-2); text-decoration: none; }
  .tab.on { background: rgba(11,11,11,0.07); color: var(--ink); font-weight: 600; }
  .tab:hover { background: rgba(11,11,11,0.05); }
  header .sub { font-size: 12.5px; color: var(--ink-2); margin-left: auto; }
  main { max-width: 760px; margin: 14px auto 40px; padding: 0 14px; }
  .note { font-size: 12px; color: var(--muted); margin: 0 0 8px 2px; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface);
    border: 1px solid var(--hairline); border-radius: 8px; overflow: hidden; font-size: 13px; }
  th, td { padding: 6px 10px; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  thead th {
    font-size: 11px; font-weight: 600; color: var(--ink-2); cursor: pointer;
    border-bottom: 1px solid var(--hairline); background: var(--surface);
    position: sticky; top: 43px; user-select: none;
  }
  thead th:hover { color: var(--ink); }
  thead th .arr { color: var(--muted); font-size: 9px; }
  tbody tr { cursor: pointer; }
  tbody td { border-top: 1px solid var(--hairline); }
  tbody tr:hover { background: rgba(11,11,11,0.04); }
  tbody tr.hl { background: #fff8dc; }
  td { font-variant-numeric: tabular-nums; }
  .decade { display: inline-block; width: 11px; height: 11px; border-radius: 2.5px;
    margin-right: 7px; vertical-align: -1px; opacity: 0.8; }
  .acrebar { display: inline-block; height: 9px; background: #d1511d; border-radius: 2px;
    margin-right: 6px; opacity: 0.7; }
</style>
</head>
<body>
<header>
  <h1>Pecos Wilderness — Burns</h1>
  <nav class="tabs">
    <a class="tab" href="index.html">Map</a>
    <a class="tab" href="trails.html">Trail table</a>
    <a class="tab on" href="burns.html">Burn table</a>
  </nav>
  <span class="sub" id="updated"></span>
</header>
<main>
  <p class="note">Click a column to sort · click a row to see the fire's perimeter on the map ·
    acreage is total fire size (perimeters can extend beyond the map area).
    Acre bars are square-root scaled so smaller fires stay visible.</p>
  <table>
    <thead><tr id="hdr"></tr></thead>
    <tbody id="body"></tbody>
  </table>
</main>
<script>
const BINS = [
  { max: 1989, color: "#f29c6b" }, { max: 1999, color: "#ea7440" },
  { max: 2009, color: "#d1511d" }, { max: 2019, color: "#9c3810" },
  { max: 9999, color: "#66230a" },
];
const binOf = y => BINS.find(b => (y ?? 0) <= b.max);

Promise.all([
  fetch("data/fires.geojson").then(r => r.json()),
  fetch("data/meta.json").then(r => r.json()),
]).then(([fires, meta]) => {
  document.getElementById("updated").textContent =
    "Perimeters as of " + meta.fetched_utc.slice(0, 10);

  const rows = fires.features.map(f => f.properties)
    .filter(p => p.acres == null || p.acres >= 1);
  const maxA = Math.max(...rows.map(r => Math.sqrt(r.acres || 0)));

  const COLS = [
    { k: "name",  label: "Fire",  get: r => (r.name || "").toLowerCase(), asc: true },
    { k: "year",  label: "Year",  get: r => r.year ?? 0 },
    { k: "acres", label: "Acres", get: r => r.acres ?? 0 },
  ];
  let sortK = "year", sortAsc = false;
  const hl = new URLSearchParams(location.search).get("hl");

  function render() {
    const hdr = document.getElementById("hdr");
    hdr.innerHTML = COLS.map(c =>
      `<th data-k="${c.k}">${c.label} <span class="arr">${c.k === sortK ? (sortAsc ? "▲" : "▼") : ""}</span></th>`
    ).join("");
    hdr.querySelectorAll("th").forEach(th => th.onclick = () => {
      const k = th.dataset.k;
      if (sortK === k) sortAsc = !sortAsc;
      else { sortK = k; sortAsc = COLS.find(c => c.k === k).asc || false; }
      render();
    });
    const col = COLS.find(c => c.k === sortK);
    const sorted = [...rows].sort((a, b) => {
      const x = col.get(a), y = col.get(b);
      return (x < y ? -1 : x > y ? 1 : 0) * (sortAsc ? 1 : -1);
    });
    const body = document.getElementById("body");
    body.innerHTML = sorted.map(r => {
      const key = `${r.name}|${r.year}`;
      const w = r.acres ? Math.max(2, Math.sqrt(r.acres) / maxA * 90) : 0;
      return `<tr data-key="${encodeURIComponent(key)}" class="${key === hl ? "hl" : ""}">
        <td><span class="decade" style="background:${binOf(r.year).color}"></span>${r.name}</td>
        <td>${r.year ?? "—"}</td>
        <td><span class="acrebar" style="width:${w}px"></span>${(r.acres ?? 0).toLocaleString()}</td>
      </tr>`;
    }).join("");
    body.querySelectorAll("tr").forEach(tr =>
      tr.onclick = () => location.href = "index.html?fire=" + tr.dataset.key);
    const h = body.querySelector("tr.hl");
    if (h) h.scrollIntoView({ block: "center" });
  }
  render();
});
</script>
</body>
</html>
