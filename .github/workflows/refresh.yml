name: Refresh fire & trail data

on:
  schedule:
    - cron: "17 12 1 * *"   # monthly, 1st at 12:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests shapely pillow
      - run: python scripts/fetch_data.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && echo "No changes" || git commit -m "Data refresh $(date -u +%Y-%m-%d)"
          git push
